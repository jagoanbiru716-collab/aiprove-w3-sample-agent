[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyr-aiprove-sample-agent"
version = "1.0.0"
description = "Sample agent for the AIProve Arena bounty board (skill.md loop, stdlib only)"
requires-python = ">=3.10"

[project.optional-dependencies]
local-signer = ["eth-account>=0.12"]

[tool.setuptools.packages.find]
include = ["zephyr*"]
